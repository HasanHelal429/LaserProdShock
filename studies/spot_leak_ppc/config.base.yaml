meta:
  run_id: OVERRIDDEN
  phase: 1
  deck: OVERRIDDEN
  description: Base config for the transverse-leak ppc discriminator. P1_vac_2d_spot
    leaks about 7 percent of its absorbed power outside 2.5 waists by 2 ps, in a broad
    flat pedestal rather than a wall pile-up, and the transverse density ripple at
    the critical surface reaches 9.4 percent -- which is the 36 ppc shot-noise floor.
    Near critical, n_ref = sqrt(1 - n_e/n_cr) goes to zero and amplifies any density
    gradient by 1/n_ref, so shot noise refracts rays out of the spot. If that is the
    mechanism the leak must fall with ppc; if the leak is refraction off the plume
    real transverse gradient it will not. Target thinned to 100 d_e and t_end cut
    to 1 ps so 144 ppc fits in 12 GB -- at 1 ps the rarefaction has crossed only ~4
    d_e of the slab, so the corona the rays actually see is the same one the 400 d_e
    physics run has at that time.
  reference: RESULTS 2026-07-29 (the finite-spot leak); parent runs/P1/P1_vac_2d_spot;
    mechanism from OVERVIEW.md (eikonal refraction) and the G5 ppc bound in TEST_PLAN.md
    6
reference:
  length_scale: critical
  mass_ratio: 100.0
  charge_state: 1
laser:
  wavelength_um: 1.053
  intensity: 1.0e18
  direction: z
  inject_side: hi
  incidence_angle_deg: 0.0
  Z_eff: 5.0
  coulomb_log: 5.0
  temperature_mode: local
  intervals: 10
  ray_cfl: 0.25
  profile_intervals: 3600
  beam:
    profile: gaussian
    waist_de: 20
    rays_per_cell: 1
plasma:
  target:
    density_over_ncr: 1.5
    thickness_de: 100
    scale_length_de: 60
    center_de: -50
    shape: planar
    theta_e_init: 0.0001
    theta_i_init: 1.0e-06
  ambient: null
field:
  orientation: none
  vA_over_c: 0.0
geometry:
  dims: 2
  normal_axis: z
  dz_over_de: 0.5
  dx_over_dz: 1.0
  axis:
    lo_de: -100
    hi_de: 400
  transverse:
    lo_de: -80
    hi_de: 80
  boundary:
    axis:
      lo: open
      hi: open
    transverse:
      lo: periodic
      hi: periodic
numerics:
  cfl: 0.35
  particle_shape: 2
  max_step: 14400
  ppc:
    target: 36
    ambient: 36
diagnostics:
  plotfile_intervals: 14400
  field_intervals: 3600
  phase_intervals: 14400
  reduced_intervals: 360
gates:
  omega_pe_dt_max: 1.2
  dz_over_lambdaD_max: 8.0
  ppc_target_min: 36
  compression_factor: 2.0
controls:
  parent_run: runs/P1/P1_vac_2d_spot
  note: the ladder overrides numerics.ppc only; the pair shares geometry, beam and
    duration so the LEAK RATIO is the result
targets:
  expect: leak share outside 2.5 w0 falls roughly as the ripple amplitude does, i.e.
    as 1/sqrt(ppc), if the mechanism is shot-noise refraction. 36 -> 144 ppc halves
    the per-cell density noise, so a noise-driven leak should drop by about a factor
    2 (in deflection angle) and the pedestal share by more.
  falsified_by: a leak share unchanged within its own scatter across the pair -- that
    would make the pedestal refraction off a REAL transverse gradient, a physical
    property of a finite spot rather than a resolution artifact, and it would then
    belong in every finite-spot error budget.
  why_it_matters: '7 percent is the same size as the effects H5 is trying to measure.
    Until this is settled a finite-spot coupling number cannot be quoted to better
    than that, and the fix is different in the two cases: more ppc, or a wider box
    and a beam that is negligible far from the wall.'
