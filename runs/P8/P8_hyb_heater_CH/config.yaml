# P8_hyb_heater_CH -- HYBRID (kinetic ions, fluid electrons) twin of P7_omega19_I5e13, the OMEGA 2019
# shot (Schaeffer et al., PRL 122, 245001). Matrix P8 = drive {laser, heater} x ions
# {effective CH (Z 3.5, A 6.5), C6+ + H+}; this run: drive = heater, ions = CH.
# Same physics as P7 (80 um CH target at 10 n_cr, 40 eV CH ambient at 0.9e18 cm^-3,
# B = 10 T x0/(d+x0) on the GRID, 351 nm, 5 mm box, to 4.5 ns). Hybrid numerics:
#   dz 2.00 um (2544 cells; P7 0.15 um), dt 400 fs (particle CFL 0.4 at 2000 km/s),
#   substeps 194 (whistler requirement 19 in the 10 T ambient, 193 at the
#   0.1 n_amb floor), electrons advected at 40 eV uniform, eta = Spitzer at 400 eV.
# Electron collision pairs removed (no electron macroparticles); ion-ion pairs as P7.
# Heater: electron-fluid heating operator over the outer 10 um of the target face, 0-2 ns,
# H = 3.24e+23 m^2/s^3 (first guess: the laser's absorbed flux 0.8 x 5e17 W/m^2 deposited in that
# window); laser off (intensity 0). Calibrate H to v_sh ~ 750 km/s.
# Generated by stage_P8.py from P7's config (2026-10-12).

