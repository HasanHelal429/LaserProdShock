meta:
  run_id: P4_lez_kin_bg5
  phase: 4
  deck: inputs_P4_lez_kin_bg5
  description: The clean 2698 leg. P4_lez_kin_flashic's initial condition -- which the
    Fig.-2 replication shows reproduces FLASH's own IC on all four panels INCLUDING the
    laser deposition profile, the paper's own acceptance test -- but with a background of
    1e-5 n_cr instead of none. 1e-5 is the paper's stated PIC density floor (n_cr/N_ppc),
    and it is 100x thinner than P4_lez_kin_bg's 1e-3, which is 33940x DENSER than the
    1e-10 g/cc chamber gas it stands for and which moved the plume front 1.8x between
    bg3 and bg4. The question is whether kin_bg's better agreement is physics or tamper.
  reference: TEST_PLAN.md 12; runs/P4/README.md D1 and D5; RESULTS.md 2026-08-18

reference:
  length_scale: critical
  mass_ratio: 2698.0          # m_Al/m_e at the paper's reduced m_p/m_e = 100
  charge_state: 13

laser:
  wavelength_um: 1.064
  intensity: 1.0e17           # 1e13 W/cm^2, the paper's value
  direction: z
  inject_side: hi
  incidence_angle_deg: 0.0
  Z_eff: 13.0
  coulomb_log: 6.3
  temperature_mode: local
  intervals: 10
  ray_cfl: 0.25
  profile_intervals: 27648
  beam:
    profile: uniform

geometry:
  dims: 1
  normal_axis: z
  dz_over_de: 0.5
  axis:
    lo_de: -224               # 200 d_e of target + 24 d_e of clearance behind it.
                              # -224..2464 is 2688 d_e = 5376 cells at dz 0.5,
                              # and 5376 = 64 x 84: AMReX aborts outright if the
                              # domain is not divisible by blocking_factor (8),
                              # which the first draft's 5340 was not.
    hi_de: 2464               # essentially unchanged from P4_lez_kin; its plume front reached
                              # zeta = 192 (1920 d_e) by tau = 27 with NO reservoir. With
                              # a reservoir the front should sit nearer FLASH's zeta = 95,
                              # so this is now generous rather than marginal.
  boundary:
    axis:
      lo: reflecting          # stands for the rest of a semi-infinite target. With a real
                              # reservoir this is MORE justified than it was in P4_lez_kin:
                              # FLASH's slab is 295 d_e thick at 795 n_cr and is barely
                              # touched (0.275 % ablated in 27 tau), so its rear face is
                              # genuinely a symmetry plane on this timescale.
      hi: open                # the plume must leave

plasma:
  target:
    # ================= THE INITIAL CONDITION, FITTED TO FLASH =================
    # Fits to Ablation_prod_08-17 at t = 0.1 ns (tau = 2.69), expressed in WarpX units
    # (z in WarpX d_e = FLASH zeta x 10, because WarpX's d_i0 = 10 d_e).
    #
    # [1] RESERVOIR. FLASH's target is 795 n_cr and 295 d_e thick; PIC cannot carry that
    #     (omega_pe*dt = 4.93 at 795 n_cr, against the gate's 1.2). 40 n_cr x 200 d_e gives
    #     omega_pe*dt = 0.79 at cfl 0.25 -- room for 2.3x compression before the gate --
    #     and an areal density 11.7x that of P4_lez_kin. FLASH ablates 1.06e23 m^-2 over
    #     27 tau, which is 7.9 % of this reservoir against ~100 % of P4_lez_kin's. That is
    #     the difference between a target that ablates and one that disassembles: measured,
    #     P4_lez_kin's peak fell 10 -> 1.74 n_cr and it went fully underdense. [D5]
    density_over_ncr: 40
    thickness_de: 200
    center_de: -100           # slab spans -200..0; face (and the laser side) at z = 0
    shape: planar

    # [2] CORONA SHAPE. FLASH's corona below n_cr is an EXPONENTIAL of scale 6.955 d_e,
    #     fitted over 1e-3..1 n_cr with rms(ln n) = 0.107. The Gaussian this project used
    #     until now fits the same data at rms 0.361, and cannot be rescued by tuning: a
    #     Gaussian's local scale length L^2/(2z) varies through the corona, so matching
    #     L_n at n = 0.1 n_cr forces the critical surface out to 24-42 d_e. P4_lez_kin's
    #     Gaussian (Ln = 27 d_e, n_max = 10) put n_cr at 40.6 d_e where FLASH has it at
    #     2.3 -- a factor 18 -- so the laser began depositing far out in a tenuous corona
    #     instead of at a compact ablation front.
    corona_profile: exponential
    scale_length_de: 6.955
    corona_density_over_ncr: 1.0    # the corona is anchored at n_cr ...
    corona_offset_de: 2.3144        # ... which sits 2.31 d_e in front of the face

    # [3] TEMPERATURE. FLASH's corona is ISOTHERMAL at 378.3 eV (spread 374-379 across
    #     four decades of density) over a cold solid. P4_lez_kin used 100 eV everywhere:
    #     3.8x too cold in the corona, where inverse bremsstrahlung goes as T^(-3/2), and
    #     far too hot in the solid.
    theta_e_init: 7.4032e-4   # 378.3 eV -- the corona, density-weighted from FLASH
    theta_i_init: 2.2622e-4   # 115.6 eV -- FLASH's corona T_i, so T_e/T_i = 3.27 at t=0
    theta_e_solid: 3.914e-5   # 20 eV. NOT FLASH's 0.1377 eV: at 40 n_cr that would give
                              # dz/lambda_D = 6100 and the solid would numerically heat
                              # faster than the laser heats it. 20 eV gives 413, still bad
                              # (G2 will warn) which is exactly why the laser-off control
                              # below is mandatory. Recorded as a KNOWN departure from
                              # FLASH, not a fit.
    theta_i_solid: 3.914e-6   # 2 eV

    # [4] VELOCITY. The handoff state is a rarefaction already in motion: FLASH's corona
    #     carries v/C_S0 = 0.548 + 0.05598 z[d_e], reaching 4-5 C_S0 at its tip (rms
    #     residual 0.099 C_S0). P4_lez_kin started it AT REST. Converted to u = gamma v/c
    #     with C_S0(WarpX) = 8.3514e5 m/s, i.e. C_S0/c = 2.78574e-3.
    drift_uz_de: [1.5271e-3, 1.5593e-4]

  ambient:
    # 1e-5 n_cr -- the paper's own stated PIC floor, "the minimum density in PIC being
    # limited to n_cr/N_PPC ~ 1e-5 n_cr". NOT a physical chamber: FLASH's 1e-10 g/cc is
    # 2.95e-8 n_cr, which PIC cannot resolve and the paper says so outright. The point is
    # that P4_lez_kin_bg carries 1e-3, i.e. 34000x the chamber it stands for and 100x this,
    # and bg3 -> bg4 moved the plume front 1.8x. If agreement survives at 1e-5 it was
    # physics; if it collapses toward P4_lez_kin_flashic, kin_bg's agreement was tamping.
    density_over_ncr: 1.0e-5
    theta_e: 1.957e-6
    theta_i: 1.957e-7

field:
  orientation: none

numerics:
  cfl: 0.25                   # 0.35 -> 0.25 to buy headroom at 40 n_cr: omega_pe*dt = 0.79
                              # at t = 0 and stays under the 1.2 gate to 2.3x compression.
                              # CLAUDE.md: check omega_pe*dt at the PEAK COMPRESSED density,
                              # not at t = 0 -- a run that started at 1.91 reached 2.43 and
                              # every number after that was measuring the instability.
  particle_shape: 2
  max_grid_size: 5000
  max_step: 774144            # = 28 x 27648. dt = 0.125 d_e/c = 0.0706 fs, so
                              # t_end = 54.66 ps = 26.96 d_i0/C_S0 -- the SAME normalised
                              # duration as FLASH's 1 ns and as every other Phase-4 leg.
  ppc:
    target: 500
    ambient: 1

collisions:
  enabled: true
  type: coulomb
  intervals: 1                # WAS 10. The D3 gate (studies/collision_gate/, 2026-08-18)
                              # measured that ndt = 10 costs of order 10-15 % in the e-i
                              # equilibration rate, and collisions are only 10.4 % of a
                              # step, so ndt = 1 removes the uncertainty for ~2x wall time.
  coulomb_log: 6.3
  pairs:                      # TARGET ONLY -- deliberately identical to P4_lez_kin_flashic
    - [targ_electrons, targ_electrons]   # and P4_lez_kin_bg, so this run differs from its
    - [targ_electrons, targ_ions]        # parent in ONE thing: the background density.
    - [targ_ions, targ_ions]
    # The complete 10-pair set (adding ambient self- and target<->ambient collisions) was
    # tried first and cost 0.058 s/step against 0.0068 -- an 8.5x slowdown, ETA 12h28m --
    # because every pair touching an ambient species walks all 5376 cells while the target
    # occupies ~1000. At 1e-5 n_cr and 1 ppc the ambient carries ~1e-5 of the mass, so its
    # collisional coupling is a second-order effect bought at 8.5x the wall clock. Left
    # OUT deliberately, and recorded here rather than silently: it means this run, like its
    # parents, has a collisionless background.

diagnostics:
  plotfile_intervals: 27648
  field_intervals: 6912
  phase_intervals: 27648
  reduced_intervals: 1024

gates:
  omega_pe_dt_max: 1.2
  dz_over_lambdaD_max: 8.0
  ppc_target_min: 500
  compression_factor: 2.3

controls:
  laser_off: P4_lez_kin_flashic_off
