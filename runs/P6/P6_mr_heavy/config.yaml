meta:
  run_id: P6_mr_heavy
  phase: 6
  deck: inputs_P6_mr_heavy
  description: "P6 LEG C -- THE SAME REDUCED MASS RATIO, BOUGHT THE OTHER WAY. m_i/m_e = 2698,\n\
    \    identical to leg B, but reached by RAISING the electron to 18.362 m_e instead of\n    lightening\
    \ the ion. The ion is therefore real aluminium and mu = 1, exactly as in\n    leg A, while the\
    \ computational mass ratio is exactly B's. This is PSC's convention\n    (GOTCHAS: \"PSC's ion\
    \ is REAL aluminium at every ReducedMassRatio\").\n    THE HYPOTHESIS: C reproduces A's physics\
    \ at B's cost. omega_pe falls as 1/sqrt(m_e)\n    by precisely the factor dt rises with dz ~\
    \ d_e ~ sqrt(m_e), so omega_pe*dt is\n    INVARIANT at 0.553 and the 4.285x coarser grid is free\
    \ -- 18.4x cheaper than A in\n    cells x steps, while covering the same 1.0 ns of FLASH's flat\
    \ top.\n    WHAT IT COSTS, and it is not nothing: lambda_D is mass-INDEPENDENT while dz grows\n\
    \    as sqrt(m_e), so dz/lambda_D degrades 58.1 -> 249.0. Grid heating therefore rises,\n   \
    \ which is why the G3 laser-off control is mandatory on this leg rather than merely\n    good\
    \ practice. If C fails, the first suspect is the grid, not the convention, and\n    the discriminator\
    \ is a finer-dz repeat -- deliberately NOT run up front."
  reference: runs/P6/README.md (the mass-convention experiment)
  parent: runs/P5/P5_flashic
