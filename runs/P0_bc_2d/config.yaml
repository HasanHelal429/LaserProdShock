# P0_bc_2d — the 2D transverse boundary, and the planar baseline for 1D<->2D.
#
# 2D adds a transverse axis, and with it a boundary choice that has no 1D analogue.
# The two options are not two ways of writing the same thing:
#
#   transverse PERIODIC  -> the drive is EXACTLY PLANAR and a uniform beam is
#       effectively infinite. This is the configuration in which a 2D run must
#       reproduce 1D on axis, so it is the 1D<->2D validation, and it is what this
#       run establishes. It is also what the known-good run_laser_shock_2d deck used.
#
#   transverse OPEN      -> a finite system: plasma can leave sideways, so lateral
#       rarefaction is real and a finite beam spot means something. Required for the
#       Phase 1/3 finite-spot physics (planarity, H5), but it introduces edge effects
#       whose reach has to be measured against the box width first.
#
# This run is the periodic one. The open-transverse variant is the declared follow-up
# (see README) -- it is only meaningful once the planar case is known to match 1D,
# because otherwise a 2D<->1D discrepancy has two candidate causes.
#
# The transverse extent is 80 d_e,cr = 13.4 um. Note it is deliberately NOT sized for
# gyro-scale physics: rho_i0 here is 265 d_e,cr, so 80 d_e,cr is ~0.3 rho_i0. Phase 2
# sizes the transverse box against rho_i0 (which IS affordable -- see TEST_PLAN 2.1);
# this run only has to answer a boundary question.
#
# cfl = 0.5, not 0.35: with square cells the 2D Yee CFL already carries a factor
# 1/sqrt(2), and 0.5 is the setting the known-good 2D deck used. omega_pe*dt stays far
# under the limit either way at this reference density (see the G1 line in the deck).

meta:
  run_id: P0_bc_2d
  phase: 0
  description: >
    2D (XZ) laser ablation with transverse-periodic boundaries: the exactly-planar
    configuration, which must reproduce P0_bc_open_B on axis. The 1D<->2D validation.
  reference: "TEST_PLAN.md 5.2; warpx-cda/laser_deposition/run_laser_shock_2d/"
  deck: inputs_P0_bc_2d

reference:
  length_scale: critical
  mass_ratio: 100.0
  charge_state: 1

laser:
  wavelength_um: 1.053
  intensity: 1.0e18
  direction: z
  inject_side: hi
  incidence_angle_deg: 0.0   # normal incidence; oblique is a Phase 3 geometry sweep
  Z_eff: 5.0
  coulomb_log: 5.0
  temperature_mode: local
  intervals: 10
  ray_cfl: 0.25
  profile_intervals: 4000
  beam:
    profile: uniform         # uniform + transverse periodic == exactly planar
    rays_per_cell: 1

plasma:
  target:
    density_over_ncr: 1.5
    thickness_de: 20
    scale_length_de: 15
    theta_e_init: 1.0e-4
    theta_i_init: 1.0e-6
    shape: planar
    center_de: -50           # flat top [-60,-40]; laser-facing face at -40
  ambient:
    density_over_ncr: 0.06
    theta_e: 5.0e-3
    theta_i: 5.0e-5

field:
  orientation: perpendicular   # B0 along y = OUT OF THE XZ PLANE (the 2D choice)
  vA_over_c: 0.003

geometry:
  dims: 2
  normal_axis: z
  axis: {lo_de: -100, hi_de: 100}
  transverse: {lo_de: -20, hi_de: 20}
  dz_over_de: 0.5
  dx_over_dz: 1.0            # square cells: the ray step is ray_cfl*min(dx)
  boundary:
    axis: {lo: open, hi: open}
    transverse: {lo: periodic, hi: periodic}

numerics:
  cfl: 0.5
  particle_shape: 2
  max_step: 8000             # 0.79 ps -- inside the 1D runs' window, for the on-axis compare
  ppc: {target: 16, ambient: 16}   # per-dim 4x4; 2D ppc is per-dimension

diagnostics:
  plotfile_intervals: 1000
  reduced_intervals: 50
  field_intervals: 200
  phase_intervals: 500

gates:
  compression_factor: 2.0
  omega_pe_dt_max: 1.2
  dz_over_lambdaD_max: 8.0
  ppc_target_min: 16         # relaxed: this is a boundary test, not an absorption
                             # measurement. G5's bias applies -- see README.

targets:
  note: "on-axis n_e(z), f_abs(t) and E_abs(t) must match P0_bc_open_B within noise;
         all transverse structure must be flat (a uniform beam on a planar target with
         periodic transverse boundaries has no x dependence to develop)"
