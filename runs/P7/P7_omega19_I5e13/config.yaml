meta:
  run_id: P7_omega19_I5e13
  phase: 7
  deck: inputs_P7_omega19_I5e13
  description: >
    OMEGA 2019 shot (Schaeffer et al., PRL 122, 245001) in 1D, laser-driven: a CH
    target at the 10 n_cr cap is ablated by a 351 nm flat-top 2 ns drive and expands
    through a magnetized CH ambient (n_e0 = 0.9e18 cm^-3, 40 eV) under the coil field
    B_y = 10 T x0/(d+x0), x0 = 1.29 mm (10 T at the target, 3 T at TCC, 3 mm). The middle
    rung of the intensity calibration ladder: the drive is tuned until the precursor
    reaches TCC at v_sh ~ 750 km/s. Coarse pilot grid (dz = 0.15 um = 3 ambient Debye
    lengths) by decision 2026-10-12; the ambient's grid heating is part of what this reads.
  reference: Schaeffer et al., PRL 122, 245001 (2019), accepted manuscript
reference:
  length_scale: critical
  # Heavy electron, real ions: m_p / m_e,SIM = 100 (the PSC/IM convention). The proton is
  # the reference ion for the derived scales; the C and H species carry their own real mass.
  mass_ratio: 100.0
  charge_state: 1
  electron_mass_scale: 18.3615267343
laser:
  wavelength_um: 0.351
  intensity: 5.0e+17           # [W/m^2] = 5e13 W/cm^2, the middle calibration rung
  direction: z
  inject_side: hi
  incidence_angle_deg: 0.0
  heat_species: target         # the laser neither sees nor heats the ambient (decision 2026-10-12)
  Z_eff: 5.2857                # CH: <Z^2>/<Z> = (36+1)/(6+1)
  coulomb_log: 8.0             # ignored under coulomb_log_mode nrl (per-cell lnLambda)
  coulomb_log_mode: nrl
  temperature_mode: local
  temperature_floor_theta: 1.9569e-06
  min_macroparticles_per_cell: 1
  intervals: "0:7994660:10"    # flat top, t0 -> t0 + 2.000 ns, applied every 10 steps
  ray_cfl: 0.05
  beam:
    profile: uniform
    rays_per_cell: 1
  refraction: 0
plasma:
  target:
    density_over_ncr: 10.0     # the P6 cap (decision D5); solid CH is ~38 n_cr at 351 nm
    thickness_de: 334.2015     # 80 um: ~35 um ablates in 2 ns at 5e13 (I^1/3 scaling), x2 margin
    center_de: -167.10075      # laser-facing face at z = 0
    corona_profile: exponential
    scale_length_de: 12.5326   # 3 um preformed ramp: the corona builds itself within ~10 ps
    shape: planar
    theta_e_init: 1.9569e-05   # ramp electrons 10 eV
    theta_i_init: 1.9569e-05
    theta_e_solid: 2.466e-06   # solid 1.26 eV, as P6
    theta_i_solid: 2.466e-06
    composition:
    - {tag: C, Z: 6, mass_amu: 11.99671, atom_fraction: 0.5}
    - {tag: H, Z: 1, mass_amu: 1.007276, atom_fraction: 0.5}
  ambient:
    density_over_ncr: 9.9445e-05   # n_e0 = 0.9e18 cm^-3
    theta_e: 7.8278e-05            # 40 eV (an upper bound: probe heating, PRL ref 35)
    theta_i: 7.8278e-05
    composition:
    - {tag: C, Z: 6, mass_amu: 11.99671, atom_fraction: 0.5}
    - {tag: H, Z: 1, mass_amu: 1.007276, atom_fraction: 0.5}
field:
  orientation: perpendicular_y
  profile:
    type: inverse
    B_peak_T: 10.0
    x0_mm: 1.29
    ref_distance_mm: 3.0       # TCC, where the paper's upstream 3 +/- 2 T sits
geometry:
  dims: 1
  normal_axis: z
  dz_over_de: 0.62663          # 0.15 um
  axis:
    lo_de: -355.0891           # 5 um behind the 80 um target
    hi_de: 20900.2005          # 5.003 mm: 33920 cells, a multiple of the blocking factor (8) and of 4 boxes
  boundary:
    axis:
      lo: reflecting
      hi: open
numerics:
  density_min_frac: 1e-06
  arena_init_size_mb: 8192
  cfl: 0.5                     # omega_pe*dt = 0.99 at 10 n_cr (heavy e)
  particle_shape: 3
  filter_npass: 4
  random_seed: 20261012
  max_grid_size: 33920         # one box per GPU (1 GPU); 8480 x 4 for the multi-GPU check
  max_step: 17988000           # t0 + 4.5 ns: covers TS at 3 mm, t0 + 3..4.5 ns
  ppc:
    target: 100
    ambient: 50
operators:
  splitter:
    species: target
    min_ppc: 40
    intervals: 100
    offset: 0.25
collisions:
  enabled: true
  type: coulomb
  intervals: 10
  # No coulomb_log: WarpX evaluates it per cell, which the 1e21/1 keV corona and the
  # 1e18/40 eV ambient both need. Piston-ambient ION pairs are omitted: the precursor is
  # collisionless in exactly those (PRL: tau_pa/tau_s >> 1).
  pairs:
  - [targ_electrons, targ_electrons]
  - [targ_electrons, targ_ions_C]
  - [targ_electrons, targ_ions_H]
  - [targ_ions_C, targ_ions_C]
  - [targ_ions_C, targ_ions_H]
  - [targ_ions_H, targ_ions_H]
  - [amb_electrons, amb_electrons]
  - [amb_electrons, amb_ions_C]
  - [amb_electrons, amb_ions_H]
  - [amb_ions_C, amb_ions_C]
  - [amb_ions_C, amb_ions_H]
  - [amb_ions_H, amb_ions_H]
  - [targ_electrons, amb_electrons]
  - [targ_electrons, amb_ions_C]
  - [targ_electrons, amb_ions_H]
  - [amb_electrons, targ_ions_C]
  - [amb_electrons, targ_ions_H]
diagnostics:
  plotfile_intervals: 1798800      # 10 frames
  field_intervals: 59960           # 300 field frames (15 ps)
  phase_intervals: 599600          # 30 subsampled particle dumps
  reduced_intervals: 19980
  checkpoint_intervals: 1998600
  phase_hist_intervals: 39973      # 450 phase-space frames (10 ps)
  phase_hist_bins: [1024, 256]
gates:
  omega_pe_dt_max: 1.2
  dz_over_lambdaD_max: 8.0
  ppc_target_min: 100
  compression_factor: 2.0
targets:
  vp_over_c: 2.5017e-3             # 750 km/s: sets the header's M_A / rho_i0 estimates
  v_sh_km_s: 750.0                 # precursor time of flight, PRL Fig. 4
  compression_ne: 10.0             # n_e/n_e0 in the pile-up
  heating_Te: 10.0                 # T_e/T_e0
  By_peak_T: 23.0                  # at x = 2.85 mm, t0 + 3.75 ns
  ts_position_mm: 3.0
