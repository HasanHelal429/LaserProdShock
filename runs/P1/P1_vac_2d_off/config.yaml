meta:
  run_id: P1_vac_2d_off
  phase: 1
  deck: inputs_P1_vac_2d_off
  description: Gate-G3 laser-off control for P1_vac_2d. Byte-for-byte the same deck
    except laser.intensity = 0, same 29.9 ps. Needed in its own right rather than inherited
    from the 1D controls, because this run has 36 ppc instead of 400 -- grid heating grows
    as macroparticle statistics get worse, so an 11x ppc reduction is exactly the case where
    the 1D bound (-0.066 percent over 1.024M steps) cannot simply be assumed to carry over.
  reference: TEST_PLAN.md 7.2; parent P1_vac_1d; truncation from P0_thick_open

reference:
  length_scale: critical
  mass_ratio: 100.0
  charge_state: 1

laser:
  wavelength_um: 1.053
  intensity: 0.0
  direction: z
  inject_side: hi
  incidence_angle_deg: 0.0
  Z_eff: 5.0
  coulomb_log: 5.0
  temperature_mode: local
  intervals: 10
  ray_cfl: 0.25
  profile_intervals: 43200
  beam:
    profile: uniform
    rays_per_cell: 1

plasma:
  target:
    density_over_ncr: 1.5
    thickness_de: 400
    scale_length_de: 60
    center_de: -200
    shape: planar
    theta_e_init: 1.0e-4
    theta_i_init: 1.0e-6
  ambient: null

field:
  orientation: none
  vA_over_c: 0.0

geometry:
  dims: 2
  normal_axis: z
  dz_over_de: 0.5
  dx_over_dz: 1.0
  axis:
    lo_de: -400
    hi_de: 1200
  transverse:
    lo_de: -16
    hi_de: 16
  boundary:
    axis:
      lo: open
      hi: open
    transverse:
      lo: periodic
      hi: periodic

numerics:
  cfl: 0.35
  particle_shape: 2
  max_step: 432000
  ppc:
    target: 36
    ambient: 36

diagnostics:
  plotfile_intervals: 43200
  field_intervals: 5400
  phase_intervals: 21600
  reduced_intervals: 1080

gates:
  omega_pe_dt_max: 1.2
  dz_over_lambdaD_max: 8.0
  ppc_target_min: 36
  compression_factor: 2.0

controls:
  physics_run: P1_vac_2d
  planar_1d_baseline: P1_vac_1d_thick
  parent_geometry: P1_vac_1d
  ray_cfl_ladder: studies/exit_overshoot (moot at intensity 0; declared so this deck stays
    identical to P1_vac_2d in every respect the gates can see)


targets:
  note: The 1D controls measured a NEGATIVE net particle-KE change at 400 ppc, dominated by
    ambipolar electron-to-ion transfer that cancels. At 36 ppc the per-cell statistics are
    11x worse, so this run is the real test of whether gate G2 (dz/lambda_D = 61) stays
    bounded at 2D-affordable ppc. The discriminator is the SIGN -- grid heating shows up as a
    net GAIN shared by both species, not as a cancelling transfer.
  expect_no_piston: true
