meta:
  run_id: P1_vac_1d
  phase: 1
  deck: inputs_P1_vac_1d
  description: Phase-1 reference ablation. An 80 d_e,cr target with the UPSTREAM
    coronal ratio L_n/w_t = 0.75 ablated into VACUUM by a 1e18 W/m^2 ray-traced laser,
    no ambient and no B0 -- the cleanest coupling test, and the only place the
    ablation scalings H1-H3 can be measured without a shock confusing them. Runs
    10 ps = 1.1 rear-rarefaction slab crossings, 4.3x longer than any Phase-0 run,
    because Phase 0 showed E_abs still rising LINEARLY at 2.35 ps.
  reference: TEST_PLAN.md 7.1; parent P0_thick_open (RESULTS 2026-07-28)

reference:
  length_scale: critical
  mass_ratio: 100.0
  charge_state: 1

laser:
  wavelength_um: 1.053
  intensity: 1.0e18
  direction: z
  inject_side: hi
  incidence_angle_deg: 0.0
  Z_eff: 5.0
  coulomb_log: 5.0
  temperature_mode: local
  intervals: 10
  ray_cfl: 0.25
  profile_intervals: 10240

plasma:
  target:
    density_over_ncr: 1.5
    thickness_de: 80
    scale_length_de: 60
    center_de: -40
    shape: planar
    theta_e_init: 1.0e-4
    theta_i_init: 1.0e-6
  ambient: null

field:
  orientation: none
  vA_over_c: 0.0

geometry:
  dims: 1
  normal_axis: z
  dz_over_de: 0.5
  axis:
    lo_de: -300
    hi_de: 700
  boundary:
    axis:
      lo: open
      hi: open

numerics:
  cfl: 0.35
  particle_shape: 2
  max_step: 102400
  ppc:
    target: 400
    ambient: 48

diagnostics:
  plotfile_intervals: 10240
  field_intervals: 1280
  phase_intervals: 5120
  reduced_intervals: 256

gates:
  omega_pe_dt_max: 1.2
  dz_over_lambdaD_max: 8.0
  ppc_target_min: 400
  compression_factor: 2.0

controls:
  laser_off: P1_vac_1d_off
  ray_cfl_ladder: studies/exit_overshoot (ray_cfl 0.05-1.0; total absorbed low by
    0.1-2.0%, no net energy creation; per-cell aliasing rms 0.73% -> 20%)
  parent_geometry: P0_thick_open

targets:
  note: Phase 0 measured f_abs peaking at 1.000 then collapsing to a noisy 0.05-0.10
    plateau within 0.1 ps, with E_abs still rising LINEARLY at 2.35 ps (60% of its
    early rate) -- i.e. coupling is DRIVE-limited at the plateau, not capacity-limited.
    That is the H2 tension of TEST_PLAN 2.3 made concrete. Quadrupling the corona
    (L_n 15 -> 60 d_e) moves the critical surface from 9.6 to 38 d_e above the face
    and quadruples the absorbing path, so the plateau should sit HIGHER; the run is
    long enough to see whether it ever rolls over.
  f_abs_peak: 1.0
  E_abs_linear_in_t: true
