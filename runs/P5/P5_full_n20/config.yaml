meta:
  run_id: P5_full_n20
  phase: 5
  deck: inputs_P5_full_n20
  description: >-
    THE DENSITY-CAP A/B, at real mass. One change from P5_full: density_over_ncr 10 -> 20.
    It tests the leading structural candidate for the 0.69x plume-T_e gap that survived
    P4. Everything cheap has already been eliminated: the deposition operator is cleared
    (retraction ledger 21 -- at matched f_abs, T_e does not move), the density floor is
    worth <4% on the FLASH-fitted exponential (ledger 20), and f_abs is now matched to
    3.4% so no absorption correction is in play. What has never been tested at real mass
    is the concession that is structural rather than numerical: FLASH's target is solid Al
    at 795 n_cr and ours is capped at 10.
    The paper's own Appendix-A scan (2/5/10/20 n_cr) found T_e matches FLASH only for
    n_max >= 5, which is read here as evidence the cap is a live lever near our operating
    point rather than a settled one -- and that scan was run at a REDUCED mass ratio, where
    HANDOFF.md 7.4 shows absorption is broken by construction. So it does not transfer.
    Read as a two-point derivative: if plume T_e moves materially between 10 and 20 n_cr,
    the cap is binding and part of the 0.69x is a reservoir/opacity artifact rather than a
    code difference. If it does not move, the cap is eliminated and attention goes to
    electron thermal transport (D3 Appendix C, never run).
  reference: TEST_PLAN.md 13; decision register runs/P5/README.md (D1-D6)
  parent: runs/P4/P4_lez_kin_mrreal_drift

reference:
  # REAL aluminium: m_Al/m_e = 26.9815 * 1836.15 = 49542. No mass reduction, so mu = 1
  # and every mu-scaling family in HANDOFF.md 6 is the identity here. That is the point
  # of this leg -- it is the only configuration in which absorption is not broken by
  # construction (HANDOFF.md 7.4: tau_abs ~ mu^0.490, and only more ion mass fixes it).
  length_scale: critical
  mass_ratio: 49542.0
  charge_state: 13

laser:
  wavelength_um: 1.064        # paper II.A -- pins n_cr = 9.848e26 m^-3, d_e,cr = 0.1693 um
  intensity: 1.0e17           # = 1e13 W/cm^2. FLASH's flat top runs to 1.0 ns, so the
                              # laser stays on for the WHOLE of this run -- unlike the
                              # parent, which stopped a fifth of the way into the flat top.
  direction: z
  inject_side: hi
  incidence_angle_deg: 0.0
  Z_eff: 13.0                 # fully ionised Al, as in FLASH (ms_targZ = ms_targZMin = 13)
  coulomb_log: 6.3            # NRL e-i at n_cr, T_e = 823 eV, Z = 13. Recorded, not used:
                              # temperature_mode is local and coulomb_log_mode is nrl, so
                              # the operator computes lnLambda per cell. Kept for the audit
                              # trail (TEST_PLAN 12.8 risk 4 -- record BOTH conventions).
  temperature_mode: local
  temperature_floor_theta: 1.9569e-6  # 1 eV -- never binds; FLASH's EOS floor is 2 eV
  min_macroparticles_per_cell: 1
  coulomb_log_mode: nrl
  intervals: 10
  ray_cfl: 0.25               # gate G4
  profile_intervals: 913950   # divisible by laser.intervals = 10 -> 10 real profile dumps
  beam:
    profile: uniform
    rays_per_cell: 1

plasma:
  target:
    density_over_ncr: 20.0    # DOUBLED -- the one and only difference from P5_full.
                              # Still 40x below FLASH's 795 n_cr solid; this is a
                              # derivative, not a convergence. Two consequences to watch:
                              #  * G1 tightens. omega_pe*dt = sqrt(20)*0.175 = 0.783 at
                              #    t = 0, and at the gate's compression_factor 2.0 it
                              #    reaches 1.107 against the 1.2 limit. That is a 8%
                              #    margin, not a comfortable one. run_checks.py G1 is
                              #    binding here and must be read BEFORE launch; if the
                              #    run compresses past ~2.35x, drop cfl to 0.25 and accept
                              #    the 1.4x cost rather than trusting the margin.
                              #  * the reservoir doubles too, so the 0.9 ns ablation draw
                              #    falls 15.2% -> 7.6%. Good, but it means this leg is NOT
                              #    a single-variable test of the reservoir alone -- it
                              #    changes cap AND reservoir together. The reservoir arm
                              #    is already controlled by P5_full vs its 4.5 d_i0
                              #    parent, so the pair separates them.
    thickness_de: 500.0             # = 11.67 d_i0. NOT the paper's 4.5 -- see meta. The
                                    # extra 307 d_e is 1.4% of the 22040-cell domain, so
                                    # this costs essentially nothing, and it all sits
                                    # BEHIND the critical surface where the laser never
                                    # reaches, leaving absorption untouched at t = 0.
    center_de: -250.0               # solid-vacuum interface at z = 0, as in both codes
    # THE FLASH-FITTED CORONA, carried unchanged from the parent. Fitted over 1e-3..1 n_cr
    # to the delivered FLASH run at t = 0.1 ns: an exponential of scale 29.8024 d_e anchored
    # at n_cr, sitting 9.9173 d_e in front of the target face. rms(ln n) = 0.107 against a
    # Gaussian's 0.361. This is the fit that put zeta_cr within 3% of FLASH's.
    corona_profile: exponential
    scale_length_de: 29.8024
    corona_density_over_ncr: 1.0
    corona_offset_de: 9.9173
    shape: planar
    theta_e_init: 7.4032e-4   # 378.3 eV -- FLASH's 0.1 ns ablation layer, RAW eV. At mu = 1
    theta_i_init: 2.2622e-4   # 115.6 eV -- the raw-eV/similarity distinction of HANDOFF.md
                              # 5 does not arise: they coincide. T_e/T_i = 3.27 at t = 0.
    theta_e_solid: 2.466e-6   # 1.26 eV in the SOLID -- NOT FLASH's 290 K. The cold solid is
    theta_i_solid: 3.914e-6   # Debye-unresolvable on a uniform grid; a known departure.
    # The handoff is a rarefaction ALREADY IN MOTION: FLASH's corona carries
    # v/C_S0 = 0.548 + 0.05598 zeta. These are the parent's CORRECTED values (uza ~ 1/s,
    # uzb ~ 1/s^2 -- HANDOFF.md 6). Do not hold them fixed from a reduced-mass leg.
    drift_uz_de: [3.5638e-4, 8.4922e-6]
  ambient: null               # PIC needs no chamber gas; FLASH needs 1e-10 g/cm^3

field:
  orientation: none
  vA_over_c: 0.0

geometry:
  dims: 1
  normal_axis: z
  dz_over_de: 0.5
  axis:
    # Span 11020 d_e = 22040 cells at dz = 0.5, divisible by blocking_factor 8 (2755).
    # lo keeps the parent's 21.4251 d_e (0.5 d_i0) of margin behind the thickened target.
    lo_de: -521.4251
    hi_de: 10498.5749
    # Headroom check: the parent's plume front (n_e = 1e-2 n_cr) sat at zeta = 14.31 at
    # tau_own 5.39, against FLASH's 19.62. Extrapolating linearly to tau_own 24.26 puts
    # this leg's front near zeta 64, i.e. 2743 d_e -- a quarter of the 10499 d_e of vacuum
    # ahead of the target. The box holds the whole pulse with ~4x margin. It is NOT the
    # binding constraint; the target reservoir is.
  boundary:
    axis:
      lo: reflecting          # target REAR. Absorbing piles compression against the wall
      hi: open                # plume side. Reflecting makes unphysical counterstreaming.
numerics:
  density_min_frac: 1e-06     # six decades of resolved density. RESULTS 2026-08-18: this
                              # one parameter, not the closure or the ppc, is what moved
                              # the T_e shape onto FLASH's (RISE 1.504 -> 1.133 vs 1.148).
  arena_init_size_mb: 4096
  cfl: 0.35
  particle_shape: 2
  random_seed: 20260829       # FIXED, so P5_seed is a deliberate replicate rather than a
                              # reliance on CUDA's run-to-run nondeterminism. The measured
                              # noise floor is 12-13.5% on a single-time T_e (RESULTS
                              # CURRENT STATE), and a trajectory claim needs a band, not
                              # an anecdote.
  max_grid_size: 22040        # = the WHOLE domain. On a GPU a 1D WarpX run is 7.9x faster
                              # with one box than with the default decomposition (project
                              # memory). Must be reset whenever n_cell changes.
  max_step: 9139500           # = 45 x 203100. tau_own 24.2598, i.e. t_FLASH = 1.00000 ns
                              # exactly, the end of FLASH's flat top. At mu = 1 the WarpX
                              # clock IS the FLASH clock: 0.9 ns of physical time, not the
                              # parent's 54.66 ps of reduced-mass time.
                              # COST: the parent ran 2030600 steps in 4h24m on one RTX
                              # 4070, so this is ~19.8 h. Two 4070s exist -- run the G3
                              # control on the other one concurrently.
  ppc:
    target: 500               # first rung of the ladder, held from the parent so the
                              # A/B over the overlap window is single-variable
    ambient: 0

collisions:
  enabled: true               # the paper: auxiliary runs with collisions off "demonstrated
                              # drastically different plasma evolution". Meaningless without.
  type: coulomb
  intervals: 10
  coulomb_log: 6.3
  pairs:
    - [targ_electrons, targ_electrons]
    - [targ_electrons, targ_ions]
    - [targ_ions, targ_ions]

diagnostics:
  # MATCHED TO FLASH'S CADENCE. FLASH writes every 0.02 ns; at mu = 1 that is 203100 steps
  # here. So every WarpX dump lands on a real FLASH plotfile time and the trajectory
  # comparison needs NO interpolation in time -- which matters, because the whole point of
  # this leg is a ratio-versus-tau curve rather than a single-time ratio.
  plotfile_intervals: 203100   # 45 dumps, t_FLASH 0.12, 0.14 ... 1.00 ns
  field_intervals: 101550      # 90 dumps, streaks. Cheap: no particles.
  phase_intervals: 304650      # 30 dumps, for the phase-space movie
  reduced_intervals: 18460     # held from the parent: 495 samples of the energy ledger.
                               # The energy-partition inversion is an OPEN item (RESULTS
                               # CURRENT STATE) and has only ever been looked at over
                               # tau_own 0.5-5.4. This is the first leg that can resolve
                               # it out to 24.

gates:
  omega_pe_dt_max: 1.2        # at 20 n_cr: sqrt(20)*0.175 = 0.783 at t = 0, 1.107 at the
                              # gate's 2.0x compression. THE BINDING GATE FOR THIS RUN --
                              # check at the PEAK COMPRESSED density, not at t = 0. A
                              # violation grew total particle energy 21x once, while the
                              # laser supplied 1/1400 of it (CLAUDE.md).
  dz_over_lambdaD_max: 8.0    # WILL WARN in the cold dense target, as in every prior run
  ppc_target_min: 500
  compression_factor: 2.0

controls:
  laser_off: P5_full_off      # ITS OWN control, at real mass and full duration. The
                              # inherited P4_lez_kin_ic6_off is a DIFFERENT deck (reduced
                              # mass, 4.5 d_i0 target, 5.39 tau) and a G3 subtraction is
                              # only meaningful against a run differing in the laser alone.
  parent_short: P4_lez_kin_mrreal_drift   # the free A/B over tau_own 0 - 5.39
  density_cap_ab_of: P5_full              # this run IS the 20 n_cr arm
  sibling_flash: P4_lez_flash

targets:
  T_e_SS_eV: 823.0            # Manheimer at mu = 1. Eq. (15) carries Z^(-1/3), NOT Z^(+1/3)
  C_S_km_s: 195.0
  d_i0_real_um: 7.256
  ion_response_time_ps: 37.2
  pulse_in_response_times: 26.9
  tol_n_e: 0.20
  tol_T_e: 0.20
  tol_T_i: 0.20
  tol_V_z: 0.10
  critical_surface_speed_over_Cs: 0.8
  # WHAT THIS RUN IS FOR. The parent gave the project's cleanest cross-code number --
  # matched f_abs (0.840 vs 0.870), WarpX at 0.69x FLASH's plume T_e -- but at ONE time,
  # at which neither code is near its asymptote. Retraction ledger 15 already killed one
  # "benchmark passes" for exactly this reason. This leg replaces the single ratio with a
  # ratio-versus-tau curve over the whole pulse. A FLAT 0.69 is a code difference. A
  # RISING curve is a rate difference and the 0.69 was a stopwatch artifact.
  flash_Te_max_eV_at_1ns: 953.5    # DELIVERY.md, radiation OFF
  flash_f_abs_asserted: 0.8704     # DELIVERY.md. Convention NEVER re-derived -- an open
                                   # item, and the matched-f_abs claim rests on it.
                                   # scripts/flash_absorption.py closes it BEFORE launch.
